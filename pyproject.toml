[project]
name = "dating-bot"
version = "0.1.0"
description = "Telegram dating bot"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "pydantic-settings>=2.0,<3",
    "redis>=5.0,<6",
    "aiohttp>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
]
