[project]
name = "dating-bot"
version = "0.1.0"
description = "Telegram dating bot"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.0,<3",
    "redis>=5.0,<6",
    "aiohttp>=3.10,<4",
    "celery>=5.4,<6",
    "miniopy-async>=1.21,<2",
    "structlog>=24.0",
    "prometheus-client>=0.21",
    "pika>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "locust>=2.29",
]
